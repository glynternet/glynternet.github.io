---
layout: default
---

<div class="c-page">
		<article class="c-article">
   	 	{% include header.html %}
    	<div class="c-article__main">
        {{ content }}
		{% if page.title != 'Home' %}
			{% include comment.html %}
		{% endif %}
		<script src="/data/route.js"></script>
		<script src="/data/go-wasm-exec.js"></script>
		<script>
			const go = new Go();
			// Init Elm app after WASM is ready, since Elm may immediately call WASM functions (e.g. splitProfile) when restoring stored state.
			WebAssembly.instantiateStreaming(fetch("/data/gpx.wasm"), go.importObject).then((result) => {
				go.run(result.instance);
				initApp();
			});

			function initApp() {
				try {
					const storedState = localStorage.getItem("appState");
					const app = Elm.Main.init({
						flags: JSON.parse(storedState)
					});
					app.ports.storeState.subscribe(state => {
						localStorage.setItem("appState", state);
					});
					app.ports.logError.subscribe(msg => {
						console.error(msg);
					});
					app.ports.downloadState.subscribe(state => {
						const blob = new Blob([state], { type: 'application/json' });
						const url = URL.createObjectURL(blob);
						const a = document.createElement('a');
						a.href = url;
						a.download = 'route-state.json';
						a.click();
						URL.revokeObjectURL(url);
					});
					app.ports.calculateElevationProfileData.subscribe(gpxData => {
						const profileData = elevationProfileData(gpxData);
						app.ports.receiveElevationProfileData.send(profileData);
					});
					app.ports.requestSplitProfile.subscribe(params => {
						const result = splitProfile(params);
						app.ports.receiveSplitProfile.send(result);
					});
					app.ports.requestSplitsGpx.subscribe(segmentsJson => {
						const gpxResult = splitsToGpx(segmentsJson);
						const parsed = JSON.parse(gpxResult);
						if (parsed && parsed.error) {
							console.error('GPX generation error:', parsed.error);
							return;
						}
						const blob = new Blob([parsed], { type: 'application/gpx+xml' });
						const url = URL.createObjectURL(blob);
						const a = document.createElement('a');
						a.href = url;
						a.download = 'route.gpx';
						a.click();
						URL.revokeObjectURL(url);
					});
					// Track the elevation profile container's width so Elm can downsample
					// the track line to ~one point per pixel. The container is unmounted
					// and remounted as routes are loaded/re-uploaded (it's hidden during
					// the "Loading" state), so:
					//   - the ResizeObserver ignores a detached target: a node being torn
					//     down reports 0x0, which previously reached Elm and collapsed the
					//     track line to <2 points;
					//   - the MutationObserver stays connected and re-points the observer at
					//     whichever #profile-container currently exists, releasing the old
					//     one, instead of disconnecting after the first match.
					let observedProfileEl = null;
					const profileObserver = new ResizeObserver(entries => {
						for (const entry of entries) {
							if (!entry.target.isConnected) continue; // detaching node, 0x0 — ignore
							const w = Math.round(entry.contentRect.width);
							if (w > 0) app.ports.profileWidthChanged.send(w);
						}
					});
					function syncProfileObserver() {
						const el = document.getElementById('profile-container');
						if (el === observedProfileEl) return;
						if (observedProfileEl) profileObserver.unobserve(observedProfileEl);
						observedProfileEl = el;
						if (el) profileObserver.observe(el);
					}
					new MutationObserver(syncProfileObserver).observe(document.body, { childList: true, subtree: true });
					syncProfileObserver(); // in case the container is already present

					app.ports.requestLocation.subscribe(function() {
						if (!navigator.geolocation) {
							app.ports.receiveLocation.send({ error: "position_unavailable" });
							return;
						}
						navigator.geolocation.getCurrentPosition(
							function(pos) {
								app.ports.receiveLocation.send({
									lat: pos.coords.latitude,
									lon: pos.coords.longitude,
									accuracy: pos.coords.accuracy
								});
							},
							function(err) {
								var code = "position_unavailable";
								if (err.code === 1) code = "permission_denied";
								if (err.code === 3) code = "timeout";
								app.ports.receiveLocation.send({ error: code });
							},
							{ enableHighAccuracy: true, timeout: 10000 }
						);
					});
				}
				catch(err) {
					console.error(err);
					if (window.confirm("Error initialising app, please see console.\nWould you like to start a fresh?")) {
						localStorage.removeItem("appState");
						location.reload();
					}
				}
			}
		</script>
    	</div>
    	{% include footer.html %}
		</article>
</div>
